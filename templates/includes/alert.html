{% if messages %}
    <div id="message" class="container">

        {% for message in messages %}

            <div class="alert alert-{{ message.tags }}" role="alert">

                <button type="button"
                        class="close"
                        data-bs-dismiss="alert">
                    <span aria-hidden="true">&times;</span>
                </button>

                {% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}
                    <strong>Error:</strong>
                {% endif %}

                {{ message }}

            </div>

        {% endfor %}

    </div>
{% endif %}
